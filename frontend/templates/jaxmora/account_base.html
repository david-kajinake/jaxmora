{% extends 'jaxmora/base.html' %}

{% block content %}
<div class="account-shell">
  <header class="account-header">
    <div class="account-header-inner container">
      <a class="brand" href="{% url 'frontend:home' %}" aria-label="JAXMORA home">
        <span class="brand-mark">J</span>
        <span class="brand-name">JAX<span>MORA</span><small>.COM</small></span>
      </a>
      <nav class="account-nav" aria-label="Main navigation">
        <a href="{% url 'frontend:home' %}">Home</a>
        <a href="{% url 'frontend:films' %}">Explore</a>
        <a href="{% url 'frontend:dashboard' %}">Dashboard</a>
      </nav>
      <div class="account-header-actions">
        {% if request.user.is_authenticated %}
          {% include 'jaxmora/includes/account_dropdown.html' %}
        {% else %}
          <a href="{% url 'frontend:login' %}">Sign in</a>
          <a class="button button-small" href="{% url 'frontend:signup' %}">Join JAXMORA</a>
        {% endif %}
      </div>
    </div>
  </header>
  <main class="account-page-main">
    {% block account_content %}{% endblock %}
  </main>
</div>
{% endblock %}
