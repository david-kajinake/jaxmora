<div class="account-menu" data-account-menu>
  <button class="button button-small account-menu-trigger" type="button" aria-haspopup="menu" aria-expanded="false">
    <span>
      {% if request.user.first_name %}{{ request.user.first_name }}{% else %}{{ request.user.username }}{% endif %}
    </span>
    <span class="account-menu-chevron" aria-hidden="true">⌄</span>
    <span class="visually-hidden">Open account menu</span>
  </button>
  <div class="account-dropdown" role="menu" hidden>
    <a href="{% url 'frontend:home' %}" role="menuitem">Home</a>
    <a href="{% url 'frontend:dashboard' %}" role="menuitem">Dashboard</a>
    <a href="{% url 'frontend:profile' %}" role="menuitem">Profile</a>
    <a href="{% url 'frontend:settings' %}" role="menuitem">Settings</a>
    <div class="account-dropdown-divider" role="separator"></div>
    <a href="{% url 'frontend:privacy_policy' %}" role="menuitem">Privacy policy</a>
    <a href="{% url 'frontend:terms_of_service' %}" role="menuitem">Terms of service</a>
    <form method="post" action="{% url 'frontend:logout' %}">
      {% csrf_token %}
      <button type="submit" role="menuitem">Logout</button>
    </form>
  </div>
</div>
